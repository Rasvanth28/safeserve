# Classroom settings for live, by-hand demos (make four-modes).
# Same as server.conf except: each /upload and /refresh holds its first
# contended resource for 4 s before asking for the second, so you can click
# requests one at a time and watch who holds what; admission waits up to
# 30 s so a request waiting out that hold isn't refused.

[server]
port = 8080
workers = 16
queue_capacity = 128

# Deadlock strategy: banker | naive | lockorder | detect
mode = banker

# incremental: handlers acquire resources one type at a time, holding what
#              they have while waiting for more (the case Banker's is for).
# atomic:      the whole claim is reserved before the handler runs. This
#              alone removes hold-and-wait, so no mode can deadlock.
admit_mode = incremental

admit_timeout_ms = 30000       # banker/lockorder: total admission wait per request, then 503
queue_timeout_ms = 1000        # requests queued longer than this get 503 without being run (0 = off)
detect_interval_ms = 200       # detect: how often the detector runs
fairness_aging_ms = 250        # banker: after this wait, new requests yield (0 = off)
docroot = ./www
log_file = stdout

# Simulated work, so resource hold times are visible in experiments
simulated_db_delay_ms = 50
simulated_upload_delay_ms = 30
simulated_refresh_delay_ms = 40
step_delay_ms = 4000           # pause before the last acquisition (upload/refresh)

# Resource-utilization CSV (empty = off); also settable with --util-csv
util_csv =
util_interval_ms = 100
