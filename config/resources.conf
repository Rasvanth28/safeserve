# Resource pools and per-route maximum claims (Banker's "Max" vectors).
#
# The order of [resources] defines the global lock order used by
# mode = lockorder: WORKER(0) < BUF(1) < FD(2) < DB(3) < CLOCK(4).
# Every claim must be <= the pool total, or the server refuses to start.

[resources]
WORKER = 16
BUF = 64
FD = 128
DB = 4
CLOCK = 2

[route /static/*]
WORKER = 1
BUF = 2
FD = 2
DB = 0
CLOCK = 0

# Upload buffers the body, takes the cache write lock, then records the
# upload in the DB (CLOCK before DB).
[route /upload]
WORKER = 1
BUF = 16
FD = 4
DB = 1
CLOCK = 1

[route /query]
WORKER = 1
BUF = 8
FD = 1
DB = 1
CLOCK = 0

# Refresh reads the DB, then rewrites the cache entry (DB before CLOCK):
# the opposite order to /upload, which is what makes naive mode deadlock.
[route /refresh]
WORKER = 1
BUF = 4
FD = 2
DB = 1
CLOCK = 1

[route /metrics]
WORKER = 0
BUF = 0
FD = 0
DB = 0
CLOCK = 0

[route /health]
WORKER = 0
BUF = 0
FD = 0
DB = 0
CLOCK = 0
