name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd curl
      - name: Build
        run: make
      - name: Unit, property and concurrency tests
        run: make test
      - name: End-to-end tests
        run: make e2e
      - name: In-process deadlock demo
        run: make demo
      - name: AddressSanitizer
        run: make asan
      - name: ThreadSanitizer
        run: |
          # TSan cannot map its shadow memory with the default ASLR entropy
          # on recent Ubuntu kernels.
          sudo sysctl vm.mmap_rnd_bits=28
          make tsan
